[project]
name = "tgkit"
version = "0.3.0"
description = "A small, consistent layer over Telethon for personal accounts"
requires-python = ">=3.10"
dependencies = ["telethon>=1.36"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tgkit"]
